<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DyV Web Player Pro (HTML5 Canvas 局部刷新播放器)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      margin: 0;
    }
    h1 {
      margin: 0 0 6px 0;
      color: #38bdf8;
      font-size: 26px;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      max-width: 700px;
      line-height: 1.5;
    }
    .player-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
      border: 2px dashed transparent;
      transition: border-color 0.2s, background 0.2s;
    }
    .player-card.drag-over {
      border-color: #38bdf8;
      background: #1e3a5f;
    }
    .canvas-wrapper {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      max-width: 100%;
    }
    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .progress-bar-container {
      width: 100%;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-bar-container input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .time-label {
      font-family: monospace;
      font-size: 13px;
      color: #cbd5e1;
      min-width: 95px;
      text-align: right;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    button, label.btn-upload, select {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover:not(:disabled), label.btn-upload:hover, select:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }
    select {
      outline: none;
      appearance: auto;
    }
    .opt-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #cbd5e1;
      cursor: pointer;
      margin-left: 8px;
    }
    .opt-toggle input {
      accent-color: #4ade80;
      cursor: pointer;
    }
    input[type="file"] {
      display: none;
    }
    .stats {
      margin-top: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #34d399;
      background: #090d16;
      padding: 12px 18px;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.6;
      border: 1px solid #1e3a5f;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>

  <h1>DyV HTML5 局部刷新播放器 Pro</h1>
  <div class="subtitle">
    支持拖拽加载 .dyv 视频、动态帧率精准时间轴、进度条任意拖拽 Seek、多倍速播放及<b>脏矩形实时绿色高亮调试遮罩</b>。
  </div>

  <div class="player-card" id="dropZone">
    <div class="canvas-wrapper">
      <canvas id="videoCanvas" width="640" height="480"></canvas>
      <canvas id="overlayCanvas" width="640" height="480"></canvas>
    </div>

    <div class="progress-bar-container">
      <input type="range" id="seekBar" min="0" max="0" value="0" step="1" disabled>
      <span class="time-label" id="timeLabel">0.00s / 0.00s</span>
    </div>
    
    <div class="controls">
      <label class="btn-upload">
        📁 选择/拖入 .dyv
        <input type="file" id="fileInput" accept=".dyv">
      </label>
      <button id="btnPlay" disabled>▶ 播放</button>
      <button id="btnPause" disabled>⏸ 暂停</button>
      <button id="btnReset" disabled>⏮ 重头播放</button>

      <select id="speedSelect">
        <option value="0.5">0.5x 倍速</option>
        <option value="1.0" selected>1.0x 正常</option>
        <option value="1.5">1.5x 倍速</option>
        <option value="2.0">2.0x 倍速</option>
        <option value="4.0">4.0x 倍速</option>
      </select>

      <label class="opt-toggle">
        <input type="checkbox" id="chkOverlay" checked>
        高亮显示变动脏矩形
      </label>
    </div>

    <div class="stats" id="statsBox">
      等待加载 .dyv 视频... 可直接将 .dyv 文件拖拽至此卡片内。
    </div>
  </div>

  <script>
    class DyvWebDecoder {
      constructor(arrayBuffer) {
        this.bytes = new Uint8Array(arrayBuffer);
        this.view = new DataView(arrayBuffer);
        this.offset = 0;
        this.frames = [];
        this.keyIndices = [];
        this.parseHeader();
        this.parseAllFrames();
      }

      readVarint() {
        let result = 0, shift = 0;
        while (true) {
          if (this.offset >= this.bytes.length) throw new Error("Varint 越界");
          let b = this.bytes[this.offset++];
          result |= (b & 0x7F) << shift;
          if (!(b & 0x80)) return result;
          shift += 7;
        }
      }

      parseHeader() {
        const magic = String.fromCharCode(...this.bytes.slice(0, 4));
        if (magic !== "DYV ") throw new Error("非有效 DyV 文件 (魔数不符)");
        this.version = this.bytes[4];
        this.profile = this.bytes[5];
        this.flags = this.view.getUint16(6, true);
        this.width = this.view.getUint32(8, true);
        this.height = this.view.getUint32(12, true);
        this.tileSize = this.view.getUint16(16, true);
        this.timescale = this.view.getUint32(18, true);
        this.pixelFormat = this.bytes[22];
        this.tileCodec = this.bytes[23];
        this.transform = this.bytes[24];
        this.offset = 26;

        this.cols = Math.floor((this.width + this.tileSize - 1) / this.tileSize);
        this.rows = Math.floor((this.height + this.tileSize - 1) / this.tileSize);
        this.totalTiles = this.cols * this.rows;

        while (this.offset < this.bytes.length) {
          let boxType = this.bytes[this.offset++];
          if (boxType === 0) break;
          let len = this.readVarint();
          this.offset += len;
        }
      }

      parseAllFrames() {
        let ordinal = 0;
        while (this.offset < this.bytes.length) {
          let ftype = this.bytes[this.offset++];
          if (ftype === 0xFF) break;

          let pts = this.readVarint();
          let timeSec = pts / this.timescale;

          if (ftype === 3) {
            // EMPTY
            this.frames.push({ ordinal, type: 'empty', pts, timeSec });
          } else if (ftype === 0) {
            // KEY
            this.keyIndices.push(ordinal);
            let payloads = [];
            for (let i = 0; i < this.totalTiles; i++) {
              let len = this.readVarint();
              payloads.push(this.bytes.subarray(this.offset, this.offset + len));
              this.offset += len;
            }
            this.frames.push({ ordinal, type: 'key', pts, timeSec, payloads });
          } else if (ftype === 1) {
            // DELTA_TILES
            let count = this.readVarint();
            let indices = [];
            let prev = null;
            for (let i = 0; i < count; i++) {
              let gap = this.readVarint();
              let idx = (prev === null) ? gap : (prev + gap + 1);
              indices.push(idx);
              prev = idx;
            }
            let payloads = [];
            for (let i = 0; i < count; i++) {
              let len = this.readVarint();
              payloads.push(this.bytes.subarray(this.offset, this.offset + len));
              this.offset += len;
            }
            this.frames.push({ ordinal, type: 'tile', pts, timeSec, indices, payloads });
          } else if (ftype === 2) {
            // DELTA_RECTS
            let count = this.readVarint();
            let rects = [];
            for (let i = 0; i < count; i++) {
              let rx = this.readVarint();
              let ry = this.readVarint();
              let rw = this.readVarint();
              let rh = this.readVarint();
              let rlen = this.readVarint();
              let rdata = this.bytes.subarray(this.offset, this.offset + rlen);
              this.offset += rlen;
              rects.push({ x: rx, y: ry, w: rw, h: rh, data: rdata });
            }
            this.frames.push({ ordinal, type: 'rect', pts, timeSec, rects });
          }
          ordinal++;
        }
      }
    }

    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const overlayCanvas = document.getElementById("overlayCanvas");
    const octx = overlayCanvas.getContext("2d");

    const dropZone = document.getElementById("dropZone");
    const statsBox = document.getElementById("statsBox");
    const fileInput = document.getElementById("fileInput");
    const btnPlay = document.getElementById("btnPlay");
    const btnPause = document.getElementById("btnPause");
    const btnReset = document.getElementById("btnReset");
    const seekBar = document.getElementById("seekBar");
    const timeLabel = document.getElementById("timeLabel");
    const speedSelect = document.getElementById("speedSelect");
    const chkOverlay = document.getElementById("chkOverlay");

    let decoder = null;
    let currentFrameIdx = 0;
    let isPlaying = false;
    let timerId = null;
    let playbackSpeed = 1.0;

    function decompressTile(data) {
      if (typeof pako === 'undefined') throw new Error("需要 pako 库进行解压");
      return pako.inflate(data);
    }

    function loadFileBuffer(buf, filename) {
      try {
        decoder = new DyvWebDecoder(buf);
        canvas.width = decoder.width;
        canvas.height = decoder.height;
        overlayCanvas.width = decoder.width;
        overlayCanvas.height = decoder.height;

        seekBar.disabled = false;
        seekBar.min = 0;
        seekBar.max = decoder.frames.length - 1;
        seekBar.value = 0;

        btnPlay.disabled = false;
        btnReset.disabled = false;
        btnPause.disabled = true;

        currentFrameIdx = 0;
        renderFrame(0);

        const totalSec = decoder.frames[decoder.frames.length - 1].timeSec;
        timeLabel.innerText = `0.00s / ${totalSec.toFixed(2)}s`;
        statsBox.innerHTML = `✅ 已加载文件: <b>${filename}</b><br>` +
          `分辨率: ${decoder.width} x ${decoder.height} | 总帧数: ${decoder.frames.length} | 关键帧数: ${decoder.keyIndices.length}<br>` +
          `总时长: ${totalSec.toFixed(2)}s (动态帧率 VFR) | 瓦片大小: ${decoder.tileSize}px`;
      } catch (err) {
        alert("解析 DyV 失败: " + err.message);
      }
    }

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      loadFileBuffer(buf, file.name);
    });

    // 拖拽上传支持
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", async (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      const file = e.dataTransfer.files[0];
      if (file) {
        const buf = await file.arrayBuffer();
        loadFileBuffer(buf, file.name);
      }
    });

    speedSelect.addEventListener("change", (e) => {
      playbackSpeed = parseFloat(e.target.value);
    });

    function applyFrameToCanvas(f, drawDebug = true) {
      octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      const showDebug = chkOverlay.checked && drawDebug;

      if (f.type === 'key') {
        for (let i = 0; i < decoder.totalTiles; i++) {
          const row = Math.floor(i / decoder.cols);
          const col = i % decoder.cols;
          const x0 = col * decoder.tileSize;
          const y0 = row * decoder.tileSize;
          const w = Math.min(decoder.tileSize, decoder.width - x0);
          const h = Math.min(decoder.tileSize, decoder.height - y0);

          const rawRgb = decompressTile(f.payloads[i]);
          const imgData = ctx.createImageData(w, h);
          for (let p = 0; p < w * h; p++) {
            imgData.data[p * 4 + 0] = rawRgb[p * 3 + 0];
            imgData.data[p * 4 + 1] = rawRgb[p * 3 + 1];
            imgData.data[p * 4 + 2] = rawRgb[p * 3 + 2];
            imgData.data[p * 4 + 3] = 255;
          }
          ctx.putImageData(imgData, x0, y0);
        }
        if (showDebug) {
          octx.strokeStyle = "rgba(56, 189, 248, 0.7)";
          octx.lineWidth = 3;
          octx.strokeRect(0, 0, decoder.width, decoder.height);
        }
      } else if (f.type === 'rect') {
        for (let r of f.rects) {
          const rawRgb = decompressTile(r.data);
          const imgData = ctx.createImageData(r.w, r.h);
          for (let p = 0; p < r.w * r.h; p++) {
            imgData.data[p * 4 + 0] = rawRgb[p * 3 + 0];
            imgData.data[p * 4 + 1] = rawRgb[p * 3 + 1];
            imgData.data[p * 4 + 2] = rawRgb[p * 3 + 2];
            imgData.data[p * 4 + 3] = 255;
          }
          ctx.putImageData(imgData, r.x, r.y);

          if (showDebug) {
            octx.strokeStyle = "#4ade80";
            octx.lineWidth = 2;
            octx.strokeRect(r.x, r.y, r.w, r.h);
            octx.fillStyle = "rgba(74, 222, 128, 0.25)";
            octx.fillRect(r.x, r.y, r.w, r.h);
          }
        }
      } else if (f.type === 'tile') {
        for (let i = 0; i < f.indices.length; i++) {
          const tidx = f.indices[i];
          const row = Math.floor(tidx / decoder.cols);
          const col = tidx % decoder.cols;
          const x0 = col * decoder.tileSize;
          const y0 = row * decoder.tileSize;
          const w = Math.min(decoder.tileSize, decoder.width - x0);
          const h = Math.min(decoder.tileSize, decoder.height - y0);

          const rawRgb = decompressTile(f.payloads[i]);
          const imgData = ctx.createImageData(w, h);
          for (let p = 0; p < w * h; p++) {
            imgData.data[p * 4 + 0] = rawRgb[p * 3 + 0];
            imgData.data[p * 4 + 1] = rawRgb[p * 3 + 1];
            imgData.data[p * 4 + 2] = rawRgb[p * 3 + 2];
            imgData.data[p * 4 + 3] = 255;
          }
          ctx.putImageData(imgData, x0, y0);

          if (showDebug) {
            octx.strokeStyle = "#fbbf24";
            octx.lineWidth = 1;
            octx.strokeRect(x0, y0, w, h);
          }
        }
      }
    }

    function renderFrame(idx) {
      if (!decoder || idx >= decoder.frames.length) return;
      const f = decoder.frames[idx];
      applyFrameToCanvas(f, true);

      seekBar.value = idx;
      const totalSec = decoder.frames[decoder.frames.length - 1].timeSec;
      timeLabel.innerText = `${f.timeSec.toFixed(2)}s / ${totalSec.toFixed(2)}s`;

      let infoText = "";
      if (f.type === 'key') infoText = "全屏关键帧 (Keyframe)";
      else if (f.type === 'rect') infoText = `脏矩形局部刷新 (${f.rects.length} 块区域覆盖)`;
      else if (f.type === 'tile') infoText = `瓦片网格局部刷新 (${f.indices.length} 块瓦片)`;
      else if (f.type === 'empty') infoText = `静止空帧 (0 图像数据消耗)`;

      statsBox.innerHTML = `当前帧: <b>#${idx + 1} / ${decoder.frames.length}</b> (PTS: ${f.pts}, ${f.timeSec.toFixed(3)}s) | 倍速: ${playbackSpeed}x<br>` +
        `刷新模式: <b>${infoText}</b>`;
    }

    // 快速定位 (Seek 到目标帧)：定位到最近关键帧向后应用差量
    function seekToFrame(targetIdx) {
      if (!decoder) return;
      let lastKey = 0;
      for (let k of decoder.keyIndices) {
        if (k <= targetIdx) lastKey = k;
        else break;
      }
      for (let i = lastKey; i < targetIdx; i++) {
        applyFrameToCanvas(decoder.frames[i], false);
      }
      currentFrameIdx = targetIdx;
      renderFrame(targetIdx);
    }

    seekBar.addEventListener("input", (e) => {
      const idx = parseInt(e.target.value, 10);
      seekToFrame(idx);
    });

    function playLoop() {
      if (!isPlaying || !decoder) return;
      if (currentFrameIdx >= decoder.frames.length - 1) {
        isPlaying = false;
        btnPlay.disabled = false;
        btnPause.disabled = true;
        return;
      }

      const currF = decoder.frames[currentFrameIdx];
      const nextF = decoder.frames[currentFrameIdx + 1];
      const delayMs = Math.max(2, ((nextF.timeSec - currF.timeSec) * 1000) / playbackSpeed);

      timerId = setTimeout(() => {
        currentFrameIdx++;
        renderFrame(currentFrameIdx);
        playLoop();
      }, delayMs);
    }

    btnPlay.addEventListener("click", () => {
      if (!decoder) return;
      isPlaying = true;
      btnPlay.disabled = true;
      btnPause.disabled = false;
      playLoop();
    });

    btnPause.addEventListener("click", () => {
      isPlaying = false;
      clearTimeout(timerId);
      btnPlay.disabled = false;
      btnPause.disabled = true;
    });

    btnReset.addEventListener("click", () => {
      isPlaying = false;
      clearTimeout(timerId);
      seekToFrame(0);
      btnPlay.disabled = false;
      btnPause.disabled = true;
    });
  </script>
</body>
</html>
